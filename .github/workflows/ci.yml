name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    # The offline suites need no CST installation, which is the point: they run
    # anywhere. The live runners (tests/verify_*.py) need a licensed CST Studio
    # Suite and are therefore run by hand, not here.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # v7 of both actions runs on node24; v4 / v5 run on node20, which GitHub
      # has deprecated and was warning about on every run.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package itself, so CI validates the dependency
          # constraints declared in pyproject.toml rather than a copy of them.
          python -m pip install -e .

      - name: Import check
        run: python -c "import mcp_server; print('tools:', len(mcp_server.registry))"

      - name: Registry and manifest
        run: python tests/smoke_registry.py

      - name: MCP protocol compliance
        run: python tests/check_mcp_compliance.py

      - name: Self-description consistency
        run: python tests/check_self_description.py

      - name: Skill tool references
        run: python tests/check_skill_tool_refs.py

      - name: Skill layout
        run: python tests/check_skill_layout.py

      - name: Documentation consistency
        run: python tests/check_docs_consistency.py

      - name: Regression suites
        run: |
          python tests/test_audit_regressions.py
          python tests/test_port_info_verdict.py
          python tests/test_save_overwrite.py

      # check_install.py is deliberately NOT run here. It is the installation
      # acceptance check for a machine that has CST; a runner has none, so its
      # correct outcome is NOT READY (no .env, no CST_INSTALL_ROOT) and failing
      # the build on that would be a false signal. The docs/dev/verification.md
      # matrix marks it as needing CST for the same reason.

      - name: Manifest is up to date
        run: |
          git diff --exit-code -- docs/mcp_tools.json
